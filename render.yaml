services:
  - type: web
    name: master30
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
